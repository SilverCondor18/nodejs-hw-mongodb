type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
properties:
  _id:
    description: "Contact id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: "0971234567"
  contactType:
    description: "Contact type"
    type: string
    enum: ["personal", "work", "home"]
  isFavourite:
    description: "Is contact in favourite list?"
    type: boolean
    example: true
  email:
    description: "Contact's email"
    type: string
    example: "email@example.com"
  userId:
    description: "Contact owner's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

